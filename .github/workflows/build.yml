name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # So the Windows install can be built on demand, from any branch, without
  # waiting for a tag.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # No browser and no network: the domain logic is tested against frozen samples.
      - run: mvn -B verify

  # The same application, for a machine that already has a screen, a browser and
  # someone sitting in front of it. jpackage does not cross compile, so this is the
  # one job that has to run on Windows.
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      # On main, every build is its own version and keeps the same file name: the
      # address stays valid, and Windows Installer sees a newer product and
      # upgrades rather than shrugging at a version it already has. On a tag, the
      # version is the release's own and the name carries it.
      - name: msi and portable zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq "refs/heads/main") {
              ./package/windows/package.ps1 -Build $env:GITHUB_RUN_NUMBER -Suffix edge
          }
          else {
              ./package/windows/package.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: le-bon-container-windows-x64
          path: |
            target/windows/*.msi
            target/windows/*.zip
          if-no-files-found: error

  # The Windows half of what the image gets by being pushed as :latest. The tag is
  # recreated on the commit that produced the files, so edge never points at
  # something older than what it carries.
  edge:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: le-bon-container-windows-x64
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create edge dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "edge, the latest main" \
            --notes "Built from main at every change, like \`ghcr.io/pharaphara/lbc:latest\`.
          The file names do not change, so these two addresses always serve the newest build:

          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-windows-x64.msi
          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-windows-x64-portable.zip

          Each build carries a higher version than the one before, so the msi installs over it.

          Not code signed: Windows shows \"unknown publisher\" the first time. More info, then Run anyway.

          For something that stands still, take a numbered release instead."

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: le-bon-container-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
          # Unsigned, and Windows will say so. Better said here than discovered.
          body: |
            The Windows install is not code signed, so SmartScreen shows
            "unknown publisher" the first time: More info, then Run anyway.

            Docker image: `ghcr.io/pharaphara/lbc:${{ github.ref_name }}`

  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lbc
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
