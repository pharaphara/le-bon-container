name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # So the Windows install can be built on demand, from any branch, without
  # waiting for a tag.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # No browser and no network: the domain logic is tested against frozen samples.
      - run: mvn -B verify

  # The same application, for a machine that already has a screen, a browser and
  # someone sitting in front of it. jpackage does not cross compile, so this is the
  # one job that has to run on Windows.
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      # On main, every build is its own version and keeps the same file name: the
      # address stays valid, and Windows Installer sees a newer product and
      # upgrades rather than shrugging at a version it already has. On a tag, the
      # version is the release's own and the name carries it.
      - name: msi and portable zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq "refs/heads/main") {
              ./package/windows/package.ps1 -Build $env:GITHUB_RUN_NUMBER -Suffix edge
          }
          else {
              ./package/windows/package.ps1
          }
      # The runner is a Windows machine with a screen and a Chrome, which is the
      # only place this half can be tested at all: everything else in the repo is
      # tested with no browser and no network.
      - name: install it and run it
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/windows/*.msi -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($msi) {
              Start-Process msiexec -Wait -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn'
              $exe = "$env:LOCALAPPDATA\le-bon-container\le-bon-container.exe"
          }
          else {
              # No WiX, no msi: the portable zip is the same application.
              $zip = Get-ChildItem target/windows/*portable.zip | Select-Object -First 1
              Expand-Archive $zip.FullName -DestinationPath portable -Force
              $exe = (Get-ChildItem portable -Recurse -Filter le-bon-container.exe |
                Select-Object -First 1).FullName
          }
          ./package/windows/smoke.ps1 -Exe $exe -WorkDir "$env:GITHUB_WORKSPACE\smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-windows
          path: smoke/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-windows-x64
          path: smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: le-bon-container-windows-x64
          path: |
            target/windows/*.msi
            target/windows/*.zip
          if-no-files-found: error

  # A Mac has the screen, the browser and the person too, and jpackage cross
  # compiles no better here than it does for Windows. Apple silicon and Intel are
  # different machines as far as a bundled runtime is concerned, so both are built.
  macos:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      - name: dmg and portable zip
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ./package/macos/package.sh --build "$GITHUB_RUN_NUMBER" --suffix edge
          else
            ./package/macos/package.sh
          fi
      - name: install it and run it
        env:
          LBC_SMOKE_DIR: ${{ github.workspace }}/smoke
        run: |
          dmg=$(ls target/macos/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /Volumes/lbc
          sudo cp -R /Volumes/lbc/le-bon-container.app /Applications/
          hdiutil detach /Volumes/lbc -quiet
          ./package/macos/smoke.sh \
            /Applications/le-bon-container.app/Contents/MacOS/le-bon-container
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-macos-${{ matrix.arch }}
          path: smoke/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: le-bon-container-macos-${{ matrix.arch }}
          path: |
            target/macos/*.dmg
            target/macos/*.zip
          if-no-files-found: error

  # The Windows half of what the image gets by being pushed as :latest. The tag is
  # recreated on the commit that produced the files, so edge never points at
  # something older than what it carries.
  edge:
    needs: [windows, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: le-bon-container-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create edge dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "edge, the latest main" \
            --notes "Built from main at every change, like \`ghcr.io/pharaphara/lbc:latest\`.
          The file names do not change, so these addresses always serve the newest build:

          Windows
          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-windows-x64.msi
          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-windows-x64-portable.zip

          macOS, Apple silicon
          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-macos-arm64.dmg

          macOS, Intel
          - https://github.com/$GITHUB_REPOSITORY/releases/download/edge/le-bon-container-edge-macos-x64.dmg

          Each build carries a higher version than the one before, so an installer installs over it.

          Neither is signed by a paid developer account. Windows says \"unknown publisher\": More info, then Run anyway. macOS refuses a downloaded app outright: System Settings, Privacy and Security, Open anyway.

          For something that stands still, take a numbered release instead."

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: le-bon-container-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.dmg
            dist/*.zip
          # Unsigned, and Windows will say so. Better said here than discovered.
          body: |
            The Windows install is not code signed, so SmartScreen shows
            "unknown publisher" the first time: More info, then Run anyway.

            Docker image: `ghcr.io/pharaphara/lbc:${{ github.ref_name }}`

  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lbc
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Into the local daemon this time, out of the cache the push just wrote, so
      # the image can be started rather than only built. It is the half of this
      # project no desktop exercises: a display nobody watches, a window onto it
      # over a web page, and a profile on a volume.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lbc:smoke
          cache-from: type=gha
      - name: run it and look at it
        run: ./package/container/smoke.sh lbc:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-container
          path: smoke/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-container
          path: |
            smoke/*.txt
            smoke/*.log
          if-no-files-found: ignore
